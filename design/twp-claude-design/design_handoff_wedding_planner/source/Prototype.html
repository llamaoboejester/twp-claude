<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>The Wedding Planner — Interactive Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,300..700;1,6..72,300..700&family=Geist:wght@300..700&family=JetBrains+Mono:wght@400;500;700&family=Antonio:wght@400..700&display=swap" />
<link rel="stylesheet" href="tokens.css" />
<style>
  *, *::before, *::after { box-sizing: border-box; }
  body { margin: 0; background: #2a221c; font-family: var(--font-sans); }
  .nav-bar {
    position: sticky; top: 0; z-index: 50;
    background: var(--ink);
    color: var(--paper);
    border-bottom: 2px solid var(--accent);
    padding: 10px 24px;
    display: flex;
    align-items: center;
    gap: 18px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.4);
  }
  .nav-bar .brand {
    font-family: var(--font-display);
    font-weight: 700;
    font-size: 14px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--coin);
  }
  .nav-bar .brand .accent { color: var(--accent); }
  .nav-bar .sep { width: 1px; height: 22px; background: var(--ink-3); opacity: 0.5; }
  .nav-group {
    display: flex; gap: 4px;
    background: var(--paper-deep);
    padding: 3px;
    border: 1.5px solid var(--ink-3);
  }
  .nav-group button {
    background: transparent; border: 0;
    padding: 7px 12px;
    font-family: var(--font-mono);
    font-size: 10px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--ink-2);
    cursor: pointer;
    transition: all 80ms ease;
  }
  .nav-group button:hover { color: var(--ink); }
  .nav-group button.on { background: var(--accent); color: var(--paper); }
  .nav-group .lbl {
    padding: 7px 8px 7px 4px;
    font-family: var(--font-mono);
    font-size: 9px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--ink-3);
    display: flex;
    align-items: center;
  }
  .help-hint {
    position: fixed;
    bottom: 16px; left: 16px;
    z-index: 40;
    background: rgba(20,12,8,0.85);
    color: var(--coin);
    border: 1.5px solid var(--coin);
    padding: 8px 14px;
    font-family: var(--font-mono);
    font-size: 10px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    pointer-events: none;
  }
  .stage {
    display: grid;
    place-items: start center;
    min-height: calc(100vh - 56px);
    overflow-x: auto;
  }
</style>
</head>
<body>
<template id="__bundler_thumbnail">
<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <rect width="100" height="100" fill="#b5462f"/>
  <rect x="30" y="30" width="40" height="40" rx="2" fill="#f4ead7"/>
  <path d="M50 36 l3.6 7.3 8.1 1.2 -5.9 5.7 1.4 8.1 -7.2 -3.8 -7.2 3.8 1.4 -8.1 -5.9 -5.7 8.1 -1.2 z" fill="#b5462f"/>
</svg>
</template>
<div id="root"></div>

<script src="asset-inline.js"></script>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="icons.jsx"></script>
<script type="text/babel" src="cards.jsx"></script>
<script type="text/babel" src="player-board.jsx"></script>
<script type="text/babel" src="tasks.jsx"></script>
<script type="text/babel" src="central-board.jsx"></script>
<script type="text/babel" src="fixtures.jsx"></script>
<script type="text/babel" src="screens.jsx"></script>
<script type="text/babel" src="flows.jsx"></script>

<script type="text/babel">
const { useState, useEffect } = React;

const STATES = [
  { key: "lobby",     label: "Lobby" },
  { key: "play",      label: "Mid-Game" },
  { key: "play-q1",   label: "Q1 · pre-Check-In" },
  { key: "book",      label: "Book Modal" },
  { key: "wild",      label: "Wild Pick" },
  { key: "checkin",   label: "Check-In 1" },
  { key: "endgame",   label: "End Game" },
];

function App() {
  const [stateKey, setStateKey] = useState(() => localStorage.getItem("twp-state") || "play");
  const [whoseTurn, setWhoseTurn] = useState(() => localStorage.getItem("twp-turn") || "Alex");
  const [month, setMonth] = useState(() => Number(localStorage.getItem("twp-month")) || 6);

  useEffect(() => { localStorage.setItem("twp-state", stateKey); }, [stateKey]);
  useEffect(() => { localStorage.setItem("twp-turn", whoseTurn); }, [whoseTurn]);
  useEffect(() => { localStorage.setItem("twp-month", month); }, [month]);

  const { zoom, modal } = useCardZoom();

  // Adjust active player for who's turn
  const alex = { ...window.SAMPLE_ALEX_STATE, isActive: whoseTurn === "Alex" };
  const sam = { ...window.SAMPLE_SAM_STATE, isActive: whoseTurn === "Sam" };

  const renderState = () => {
    switch (stateKey) {
      case "lobby":
        return <LobbyScreen />;
      case "play":
        return <PlayScreenB
          alex={whoseTurn === "Alex" ? alex : sam}
          sam={whoseTurn === "Alex" ? sam : alex}
          month={month}
          onZoom={zoom}
        />;
      case "play-q1":
        return <PlayScreenB
          alex={{ ...alex, theme: null, goals: [], themePositions: { whimsy: 1, edge: 0, nature: 1, tradition: 0, elegance: 0 }, excitement: 4, completedTasks: 1 }}
          sam={{ ...sam, theme: null, goals: [], themePositions: { whimsy: 0, edge: 1, nature: 0, tradition: 0, elegance: 1 }, excitement: 3, completedTasks: 1 }}
          month={2}
          showThemeOptions
          onZoom={zoom}
        />;
      case "book":
        return (
          <div style={{ position: "relative", width: 1440, minHeight: 1180 }}>
            <PlayScreenB alex={alex} sam={sam} month={month} onZoom={zoom} />
            <BookCardModal card={window.SAMPLE_HAND[0]} targetCell={6} coins={7} onClose={() => setStateKey("play")} />
          </div>
        );
      case "wild":
        return (
          <div style={{ position: "relative", width: 1440, minHeight: 1180 }}>
            <PlayScreenB alex={alex} sam={sam} month={month} onZoom={zoom} />
            <WildPickModal onClose={() => setStateKey("play")} onPick={() => setStateKey("play")} />
          </div>
        );
      case "checkin":
        return <CheckInScreen number={Math.min(3, Math.max(1, Math.ceil(month/3)))} />;
      case "endgame":
        return <EndGameScreen />;
      default:
        return null;
    }
  };

  const showCardControls = stateKey === "play" || stateKey === "play-q1" || stateKey === "book" || stateKey === "wild";

  return (
    <>
      <div className="nav-bar">
        <div className="brand">The Wedding<span className="accent"> Planner</span></div>
        <div className="sep" />
        <div className="nav-group">
          <span className="lbl">State</span>
          {STATES.map(s => (
            <button key={s.key} className={stateKey === s.key ? "on" : ""} onClick={() => setStateKey(s.key)}>
              {s.label}
            </button>
          ))}
        </div>

        {showCardControls && (
          <>
            <div className="sep" />
            <div className="nav-group">
              <span className="lbl">Turn</span>
              <button className={whoseTurn === "Alex" ? "on" : ""} onClick={() => setWhoseTurn("Alex")}>Alex (you)</button>
              <button className={whoseTurn === "Sam" ? "on" : ""} onClick={() => setWhoseTurn("Sam")}>Sam (opp)</button>
            </div>
            <div className="sep" />
            <div className="nav-group">
              <span className="lbl">Month</span>
              <button onClick={() => setMonth(Math.max(1, month - 1))}>−</button>
              <span style={{
                padding: "7px 10px",
                fontFamily: "var(--font-mono)",
                fontSize: 11,
                color: "var(--paper)",
                fontVariantNumeric: "tabular-nums",
              }}>{String(month).padStart(2, "0")}</span>
              <button onClick={() => setMonth(Math.min(12, month + 1))}>+</button>
            </div>
          </>
        )}

        <div style={{ flex: 1 }} />
        <a href="index.html" style={{
          fontFamily: "var(--font-mono)",
          fontSize: 10,
          letterSpacing: "0.18em",
          textTransform: "uppercase",
          color: "var(--coin)",
          textDecoration: "none",
          padding: "7px 12px",
          border: "1.5px solid var(--coin)",
        }}>
          ← Design System
        </a>
      </div>

      <div className="stage">
        {renderState()}
      </div>

      {showCardControls && (
        <div className="help-hint">
          Double-click · Ctrl-click · or right-click any card to zoom
        </div>
      )}

      {modal}
    </>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);
</script>
</body>
</html>
